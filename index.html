<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopSetu · 3D Welcome</title>
  <!-- Google Fonts (Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
  <!-- Font Awesome 6 (free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }
    body {
      overflow: hidden;
      background: #ffffff;
    }

    /* ----- INTRO (exactly as original – no changes) ----- */
    #intro {
      position: fixed;
      inset: 0;
      background: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.6s ease;
    }
    #intro video {
      width: 95%;
      height: 95%;
      object-fit: cover;
    }
    #startBtn {
      position: absolute;
      padding: 16px 34px;
      border: none;
      border-radius: 50px;
      background: #ff7a00;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      display: none;
    }

    /* ----- WEBSITE (premium 3D welcome page, no nav, only hero + go) ----- */
    #website {
      display: none;
      min-height: 100vh;
      background: #ffffff;
      position: relative;
      overflow: hidden;
    }

    /* 3D scene container */
    .scene {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1200px;
      background: radial-gradient(circle at 20% 30%, #fafcff, #eef4fe);
      position: relative;
    }

    /* 3D card with depth */
    .card-3d {
      width: 90%;
      max-width: 900px;
      padding: 40px 30px;
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 72px;
      box-shadow: 0 40px 80px -20px rgba(7, 28, 63, 0.2), 0 0 0 1px rgba(255, 255, 255, 0.5);
      transform: rotateX(3deg) rotateY(-2deg) translateZ(20px);
      transition: transform 0.3s ease;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.3);
      animation: floatCard3d 6s infinite alternate ease-in-out;
    }
    .card-3d:hover {
      transform: rotateX(0deg) rotateY(0deg) translateZ(30px) scale(1.01);
    }

    @keyframes floatCard3d {
      0% { transform: rotateX(3deg) rotateY(-2deg) translateZ(10px); }
      100% { transform: rotateX(-1deg) rotateY(3deg) translateZ(30px); }
    }

    /* 3D icon ecosystem */
    .delivery-icon-3d {
      font-size: 110px;
      color: #071C3F;
      filter: drop-shadow(0 20px 40px rgba(255, 122, 0, 0.18));
      animation: hoverGlide 3.4s infinite alternate ease-in-out;
      display: inline-block;
      line-height: 1;
      margin-bottom: 8px;
    }
    .delivery-icon-3d i {
      background: linear-gradient(145deg, #FF7A00, #FFB347);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    @keyframes hoverGlide {
      0% { transform: translateY(0px) rotate(-2deg) scale(1); }
      100% { transform: translateY(-18px) rotate(2deg) scale(1.04); }
    }

    /* floating small 3D objects (GPS, store, scooter) */
    .float-object {
      position: absolute;
      font-size: 30px;
      color: #071C3F;
      opacity: 0.6;
      animation: floatAround 5s infinite alternate ease-in-out;
      pointer-events: none;
    }
    .float-object i {
      filter: drop-shadow(0 4px 12px rgba(255, 122, 0, 0.15));
    }
    .obj-1 { top: 12%; left: 8%; animation-delay: 0s; font-size: 38px; }
    .obj-2 { top: 18%; right: 10%; animation-delay: 1.2s; font-size: 32px; }
    .obj-3 { bottom: 22%; left: 6%; animation-delay: 2.4s; font-size: 42px; }
    .obj-4 { bottom: 16%; right: 6%; animation-delay: 0.8s; font-size: 36px; }
    .obj-5 { top: 45%; left: 4%; animation-delay: 1.8s; font-size: 28px; }
    .obj-6 { top: 50%; right: 4%; animation-delay: 3s; font-size: 34px; }

    @keyframes floatAround {
      0% { transform: translateY(0px) rotate(0deg) scale(1); }
      100% { transform: translateY(-30px) rotate(8deg) scale(1.08); }
    }

    /* main headline */
    .card-3d h1 {
      font-size: clamp(44px, 8vw, 90px);
      font-weight: 800;
      color: #071C3F;
      letter-spacing: -1.5px;
      line-height: 1.1;
      margin-top: 10px;
    }
    .card-3d h1 .highlight {
      background: linear-gradient(145deg, #FF7A00, #FFB347);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .card-3d .sub {
      font-size: 20px;
      color: #2c3e5c;
      max-width: 500px;
      margin: 18px auto 0;
      opacity: 0.85;
      font-weight: 400;
      line-height: 1.6;
    }

    /* Go button (only CTA) - now wrapped in a link */
    .go-wrapper {
      display: inline-block;
      margin-top: 38px;
      text-decoration: none;
    }
    .go-btn {
      padding: 18px 64px;
      border: none;
      border-radius: 80px;
      background: #FF7A00;
      color: white;
      font-weight: 700;
      font-size: 22px;
      cursor: pointer;
      box-shadow: 0 18px 36px rgba(255, 122, 0, 0.3);
      transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
      display: inline-flex;
      align-items: center;
      gap: 14px;
      letter-spacing: 0.5px;
      text-decoration: none;
      border: none;
    }
    .go-btn i {
      font-size: 24px;
      transition: transform 0.25s;
    }
    .go-btn:hover {
      transform: translateY(-6px) scale(1.02);
      box-shadow: 0 30px 50px rgba(255, 122, 0, 0.4);
      background: #e86d00;
    }
    .go-btn:hover i {
      transform: translateX(6px);
    }

    /* responsive */
    @media (max-width: 720px) {
      .card-3d { padding: 30px 20px; border-radius: 48px; }
      .delivery-icon-3d { font-size: 70px; }
      .float-object { display: none; }
      .go-btn { padding: 16px 44px; font-size: 18px; }
    }
    @media (max-width: 480px) {
      .card-3d { padding: 24px 16px; border-radius: 32px; }
      .delivery-icon-3d { font-size: 50px; }
      .card-3d h1 { font-size: 34px; }
      .card-3d .sub { font-size: 17px; }
    }

    /* fade in animation for the card */
    .fade-in-3d {
      animation: fadeUp3d 0.9s ease forwards;
      opacity: 0;
    }
    @keyframes fadeUp3d {
      0% { opacity: 0; transform: translateY(30px) scale(0.96); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* extra glow */
    .glow-ring {
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 122, 0, 0.03) 0%, transparent 70%);
      top: 10%;
      right: 5%;
      pointer-events: none;
      z-index: 0;
    }
    .glow-ring-2 {
      bottom: 5%;
      left: 5%;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(18, 59, 122, 0.03) 0%, transparent 70%);
    }
  </style>
</head>
<body>

<!-- INTRO (unchanged – exactly as original) -->
<div id="intro">
  <video id="introVideo" playsinline>
    <source src="setustart.mp4" type="video/mp4">
  </video>
  <button id="startBtn">Tap to Start</button>
</div>

<!-- WEBSITE – pure 3D welcome page (no nav, no sign in, only pro welcome + Go with link option) -->
<div id="website">
  <div class="scene">
    <!-- subtle glow rings -->
    <div class="glow-ring"></div>
    <div class="glow-ring glow-ring-2"></div>

    <!-- floating 3D objects (GPS, store, scooter, parcel) -->
    <div class="float-object obj-1"><i class="fas fa-map-pin" style="color:#FF7A00;"></i></div>
    <div class="float-object obj-2"><i class="fas fa-store" style="color:#123B7A;"></i></div>
    <div class="float-object obj-3"><i class="fas fa-motorcycle" style="color:#FF7A00;"></i></div>
    <div class="float-object obj-4"><i class="fas fa-box" style="color:#123B7A;"></i></div>
    <div class="float-object obj-5"><i class="fas fa-location-dot" style="color:#FF7A00;"></i></div>
    <div class="float-object obj-6"><i class="fas fa-truck-fast" style="color:#123B7A;"></i></div>

    <!-- main 3D card -->
    <div class="card-3d fade-in-3d">
      <div class="delivery-icon-3d">
        <i class="fas fa-truck-fast"></i>
        <span style="display:inline-block; margin-left:4px; background:transparent; -webkit-text-fill-color:#071C3F; color:#071C3F; font-size:0.6em;">
          <i class="fas fa-store" style="color:#123B7A; -webkit-text-fill-color:#123B7A;"></i>
        </span>
      </div>
      <h1>
        Everything <span class="highlight">Local.</span><br />Delivered.
      </h1>
      <p class="sub">
        Discover trusted nearby stores, real-time tracking, and deliveries in minutes.
      </p>
      <!-- Go button wrapped in a link — you can change the href to any URL -->
      <a href="login.html" class="go-wrapper" id="goLink">
        <button class="go-btn" id="goBtn">
          Go <i class="fas fa-arrow-right"></i>
        </button>
      </a>
      <!-- 
        🔽 INSTRUCTION: To change the link, simply edit the href attribute above.
        Example: href="https://shopsetu.com/explore" or href="/welcome" 
        The button will navigate to that URL when clicked.
      -->
    </div>
  </div>
</div>

<script>
  (function() {
    // ----- INTRO LOGIC (unchanged – exactly as original) -----
    const intro = document.getElementById('intro');
    const website = document.getElementById('website');
    const video = document.getElementById('introVideo');
    const btn = document.getElementById('startBtn');

    function showWebsite() {
      intro.style.opacity = '0';
      setTimeout(() => {
        intro.style.display = 'none';
        website.style.display = 'block';
        document.body.style.overflow = 'auto';
      }, 600);
    }

    if (sessionStorage.getItem('introPlayed')) {
      intro.style.display = 'none';
      website.style.display = 'block';
      document.body.style.overflow = 'auto';
    } else {
      video.play().catch(() => {
        btn.style.display = 'block';
      });
      btn.onclick = function() {
        btn.style.display = 'none';
        video.play();
      };
      video.onended = function() {
        sessionStorage.setItem('introPlayed', 'true');
        showWebsite();
      };
      setTimeout(() => {
        if (video.readyState === 0) {
          sessionStorage.setItem('introPlayed', 'true');
          showWebsite();
        }
      }, 2000);
    }

    // ----- OPTIONAL: You can also dynamically set the link via JavaScript -----
    // Example: document.getElementById('goLink').href = 'https://shopsetu.com/explore';
    // The link is already set in the HTML above. Edit the href attribute directly.

    // ----- (optional) click feedback on the button itself -----
    document.getElementById('goBtn')?.addEventListener('click', function(e) {
      // just a tiny haptic feedback – the link will handle navigation
      this.style.transform = 'scale(0.94)';
      setTimeout(() => {
        this.style.transform = '';
      }, 120);
    });

  })();
</script>

</body>
</html>
